# About section
about_profile_image:
about_content: |
  <!-- <a class="lang-switch" href="/en/" aria-label="Switch to English resume">EN</a> -->

  검색/추천 도메인에서 출발해 백엔드, 데이터 엔지니어링, 인프라 운영까지 확장해 온 개발자입니다.

  16년 동안 서비스 문제를 기술로 해결해 왔고, 최근에는 제품 개발과 운영을 함께 보는 개발 리더 역할을 수행했습니다.

  핵심 강점은 아래 3가지입니다.

  - **문제 해결 중심 개발**: 비즈니스 이슈를 기능/데이터/운영 관점으로 분해해 빠르게 해결
  - **백엔드 + 데이터 융합**: 검색/분석/피처 엔지니어링을 제품 가치와 연결
  - **운영 가능성까지 고려한 설계**: 개발 완료가 아니라 안정적인 운영까지 포함한 전달

content:
  - title: 경력
    layout: list
    content:
      - layout: left
        title: 카카오스타일
        sub_title: 정산 백엔드 파트리더
        caption: 2023년 4월 - 현재
        description: |
          - 준 실시간 정산 데이터 파이프라인 설계 및 구축으로 정산 처리 속도 및 데이터 정합성 개선
          - 세금계산서 SAP 연동 자동 발행 시스템 개발로 수작업 제거 및 발행 프로세스 자동화
          - 수량환불, 빠른 교환 등 다양한 사업 요구사항에 대응하는 정산 기능 설계 및 개발

      - layout: left
        title: 그로잉랩
        sub_title: 개발 리더
        caption: 2022년 5월 - 2023년 2월
        description: |
          - 프론트엔드, 백엔드, 인프라, 데이터 등 사업에 필요한 기능 개발 및 운영 총괄
          - 개발 우선순위 정리와 실행을 통해 서비스 런칭/운영 속도 개선

      - layout: left
        title: 카카오 모빌리티
        sub_title: "데이터 엔지니어 & 백엔드 개발자"
        caption: 2018년 5월 - 2022년 5월
        description: |
          - 택시 백엔드 개발
          - 데이터 엔지니어링 및 피처 엔지니어링
          - 개발/운영에 필요한 인프라 운영

      - layout: left
        title: 토스랩
        sub_title: "백엔드 개발자 & 데이터 엔지니어"
        caption: 2015년 4월 - 2017년 11월
        description: |
          - 잔디 서비스 백엔드 개발
          - 데이터 엔지니어링

      - layout: left
        title: 스프링웍스
        sub_title: 백엔드 개발자
        caption: 2013년 10월 - 2014년 11월
        description: |
          - Adobe CQ를 활용한 기업 사이트 개발

      - layout: left
        title: 인터파크
        sub_title: 백엔드 개발자
        caption: 2011년 7월 - 2013년 9월
        description: |
          - 쇼핑/도서 검색엔진 개발
          - 쇼핑 고도화 기능(카운터, 행동 분석) 개발

      - layout: left
        title: 날리지 큐브
        sub_title: 백엔드 개발자
        caption: 2009년 3월 - 2011년 6월
        description: |
          - IP 기반 위치 추적 시스템 관리
          - KMS 검색엔진 개발

  - title: 기술 스택
    layout: text
    content: |
      ![Java](https://img.shields.io/badge/Java-ED8B00?style=flat&logo=openjdk&logoColor=white)
      ![Kotlin](https://img.shields.io/badge/Kotlin-7F52FF?style=flat&logo=kotlin&logoColor=white)
      ![Python](https://img.shields.io/badge/Python-3776AB?style=flat&logo=python&logoColor=white)
      ![TypeScript](https://img.shields.io/badge/TypeScript-3178C6?style=flat&logo=typescript&logoColor=white)
      ![ChatGPT](https://custom-icon-badges.demolab.com/badge/ChatGPT-74aa9c?logo=openai&logoColor=white)
      ![Claude](https://img.shields.io/badge/Claude-D97757?logo=claude&logoColor=fff)

      <br>

      - **Backend**: Spring, Express 기반 서비스 개발
      - **Data Engineering**: Kafka, Spark, Hudi, Airflow / 로그·이벤트 파이프라인, 분석용 데이터 모델링, 피처 엔지니어링
      - **Infra/Operations**: AWS, Cloudflare(개인 프로젝트) / 서비스 운영 자동화, 장애 대응, 운영 지표 기반 개선
      - **Search/Recommendation**: Solr, ElasticSearch / 검색엔진·행동 분석 기능 개발 경험

